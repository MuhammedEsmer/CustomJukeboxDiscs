buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.+'
    }
}

apply plugin: 'java'
apply plugin: 'net.minecraftforge.gradle'

group = property('mod_group')
version = "${property('minecraft_version')}-${property('mod_version')}"

java.toolchain.languageVersion = JavaLanguageVersion.of(8)
compileJava {
    sourceCompatibility = '8'
    targetCompatibility = '8'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
}

configurations {
    shade
    compileOnly.extendsFrom shade
    implementation.extendsFrom shade
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
    shade 'javazoom:jlayer:1.0.1'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

minecraft {
    mappings channel: 'stable', version: '39-1.12'
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE

    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft_version
    inputs.property 'mod_id', project.mod_id
    inputs.property 'mod_name', project.mod_name
    inputs.property 'mod_description', project.mod_description
    inputs.property 'mod_authors', project.mod_authors

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand(
                'version': project.version,
                'mcversion': project.minecraft_version,
                'mod_id': project.mod_id,
                'mod_name': project.mod_name,
                'mod_description': project.mod_description,
                'mod_authors': project.mod_authors
        )
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    from {
        configurations.shade.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/MANIFEST.MF'
    }
    manifest {
        attributes([
            "Specification-Title": "customjukeboxdiscs",
            "Specification-Vendor": "HooDoo",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": project.version,
            "Implementation-Vendor": "HooDoo",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    into('assets/customjukeboxdiscs/lang') {
        from('src/main/resources/assets/customjukeboxdiscs/lang/en_us.lang')
        rename { 'en_US.lang' }
    }
}

test {
    useJUnitPlatform()
}
